<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GuestCord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="style.css"/>
  <script defer src="script.js"></script>
</head>
<body>
  <div id="app">
    <aside id="servers" class="panel servers"></aside>
    <aside id="channels" class="panel channels">
      <div class="channel-header">
        <span>Channels</span>
        <button id="newChannel">+</button>
      </div>
      <ul id="channelList"></ul>
    </aside>
    <main id="chat" class="panel chat">
      <header id="channelTitle" class="chat-header"></header>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <input type="text" id="messageInput" placeholder="Message" autocomplete="off"/>
        <input type="file" id="fileInput" hidden/>
        <button type="button" id="uploadBtn">📎</button>
        <button type="submit">Send</button>
      </form>
    </main>
    <aside id="users" class="panel users"></aside>
  </div>
  <div id="toolbar">
    <input id="searchBar" placeholder="Search"/>
    <button id="themeToggle">Toggle Theme</button>
    <button id="exportBtn">Export</button>
    <input type="file" id="importInput" accept="application/json" hidden/>
    <button id="importBtn">Import</button>
  </div>
</body>
</html>
